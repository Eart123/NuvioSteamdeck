name: Linux Build

on:
  push:
    branches: [main, master, Dev]
    tags: ['v*']
  pull_request:
    branches: [main, master, Dev]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    name: Build Linux (DEB + AppImage)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize MPVKit submodule (ignore failure)
        run: |
          git submodule update --init MPVKit 2>/dev/null || echo "MPVKit submodule init failed, continuing without it"
        shell: bash

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          # Empty local.properties for CI - required by generateRuntimeConfigs task
          # Actual values are not needed for Linux build
          EOF

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-disabled: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev \
            libwebkit2gtk-4.1-dev \
            libmpv-dev libmpv2 \
            pkg-config \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libepoxy-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libpipewire-0.3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libasound2-dev \
            libpulse-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            ninja-build \
            cmake \
            wget \
            unzip

      - name: Generate version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Tag push: use tag name (e.g., v1.0.0 -> 1.0.0)
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            # Branch push: read version from DesktopVersion.properties
            if [ -f "composeApp/Configuration/DesktopVersion.properties" ]; then
              VERSION=$(grep "VERSION_NAME=" composeApp/Configuration/DesktopVersion.properties | cut -d'=' -f2)
              # Remove any suffix like -alpha, -beta
              VERSION="${VERSION%%-*}"
            else
              # Fallback: timestamp-based version
              VERSION="0.1.0-dev.$(date +%Y%m%d%H%M)"
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$(date +%s)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build Linux DEB + AppImage
        run: |
          ./gradlew :composeApp:packageReleaseDeb :composeApp:packageReleaseAppImage \
            --no-daemon \
            --no-configuration-cache \
            -Pnuvio.desktop.versionName=${{ steps.version.outputs.version }} \
            -Pnuvio.desktop.versionCode=${{ steps.version.outputs.version_code }}
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.native.enableKlibsCrossCompilation=false"

      - name: Find artifacts
        id: artifacts
        run: |
          echo "deb=$(find composeApp/build -name '*.deb' -type f | head -1)" >> $GITHUB_OUTPUT
          echo "appimage=$(find composeApp/build -name '*.AppImage' -type f | head -1)" >> $GITHUB_OUTPUT
          echo "tar=$(find composeApp/build -name '*.tar.gz' -type f | head -1)" >> $GITHUB_OUTPUT

      - name: Upload DEB artifact
        if: ${{ steps.artifacts.outputs.deb != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-deb
          path: ${{ steps.artifacts.outputs.deb }}
          retention-days: 30

      - name: Upload AppImage artifact
        if: ${{ steps.artifacts.outputs.appimage != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-appimage
          path: ${{ steps.artifacts.outputs.appimage }}
          retention-days: 30

      - name: Upload Tarball artifact
        if: ${{ steps.artifacts.outputs.tar != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-tarball
          path: ${{ steps.artifacts.outputs.tar }}
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.deb }}
            ${{ steps.artifacts.outputs.appimage }}
            ${{ steps.artifacts.outputs.tar }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}