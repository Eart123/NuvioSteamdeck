name: Linux Build

on:
  push:
    branches: [main, master, Dev]
    tags: ['v*']
  pull_request:
    branches: [main, master, Dev]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    name: Build Linux (DEB + AppImage)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize MPVKit submodule (ignore failure)
        run: |
          git submodule update --init MPVKit 2>/dev/null || echo "MPVKit submodule init failed, continuing without it"
        shell: bash

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          # CI local.properties for Linux build
          NUVIO_SUPABASE_URL=https://dummy.supabase.co
          NUVIO_SUPABASE_ANON_KEY=dummy-anon-key
          NUVIO_SUPABASE_FALLBACK_URL=https://dummy.supabase.co
          SENTRY_DSN=
          SENTRY_DESKTOP_DSN=
          TMDB_API_KEY=dummy-tmdb-key
          TRAKT_CLIENT_ID=dummy-trakt-id
          TRAKT_CLIENT_SECRET=dummy-trakt-secret
          SIMKL_CLIENT_ID=dummy-simkl-id
          NUVIO_DISCORD_CLIENT_ID=1538974392376369212
          MDBLIST_CLIENT_ID=dummy-mdblist-id
          INTRODB_API_URL=
          IMDB_RATINGS_API_BASE_URL=
          IMDB_TAPFRAME_API_BASE_URL=
          PREMIUMIZE_CLIENT_ID=
          CONTRIBUTIONS_URL=
          SUPPORTERS_WALL_URL=https://nuvio.tv/api/supporters/wall
          DONATIONS_BASE_URL=
          DONATIONS_DONATE_URL=
          EOF

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-disabled: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libgtk-4-dev libadwaita-1-dev \
            libwebkit2gtk-4.1-dev \
            libmpv-dev libmpv2 \
            pkg-config \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libepoxy-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcomposite-dev \
            libxext-dev \
            libpipewire-0.3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libasound2-dev \
            libpulse-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            ninja-build \
            cmake \
            wget \
            unzip \
            patchelf \
            build-essential \
            dpkg-dev \
            rpm \
            fakeroot \
            xauth \
            xvfb

      - name: Install appimagetool
        run: |
          APPIMAGETOOL_VERSION=1.9.1
          APPIMAGETOOL_SHA256=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          appimagetool_path="/usr/local/bin/appimagetool"
          curl -fsSL -o "${appimagetool_path}" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          actual_sha256="$(sha256sum "${appimagetool_path}" | awk '{print $1}')"
          if [[ "${actual_sha256}" != "${APPIMAGETOOL_SHA256}" ]]; then
            echo "appimagetool checksum mismatch." >&2
            echo "Expected: ${APPIMAGETOOL_SHA256}" >&2
            echo "Actual:   ${actual_sha256}" >&2
            exit 1
          fi
          chmod +x "${appimagetool_path}"
          echo "appimagetool installed at ${appimagetool_path}"

      - name: Verify pkg-config packages
        run: |
          echo "=== Checking pkg-config packages ==="
          for pkg in mpv webkit2gtk-4.1 gtk+-3.0 x11 xcomposite xext; do
            echo "Checking $pkg..."
            pkg-config --cflags --libs $pkg || echo "WARNING: $pkg not found"
          done
          echo "=== pkg-config check complete ==="

      - name: Generate version
        id: version
        run: |
          echo "DEBUG: github.ref_type = ${{ github.ref_type }}"
          echo "DEBUG: github.ref_name = ${{ github.ref_name }}"
          echo "DEBUG: Checking for DesktopVersion.properties..."
          if [ -f "composeApp/Configuration/DesktopVersion.properties" ]; then
            echo "DEBUG: File exists"
            cat composeApp/Configuration/DesktopVersion.properties
            VERSION=$(grep "VERSION_NAME=" composeApp/Configuration/DesktopVersion.properties | cut -d'=' -f2)
            echo "DEBUG: Raw VERSION from file: '$VERSION'"
            VERSION="${VERSION%%-*}"
            echo "DEBUG: Stripped VERSION: '$VERSION'"
          else
            echo "DEBUG: File not found, using fallback"
            VERSION="0.1.0-dev.$(date +%Y%m%d%H%M)"
          fi
          echo "DEBUG: Final VERSION = '$VERSION'"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$(date +%s)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Debug version output
        run: |
          echo "Generated version: ${{ steps.version.outputs.version }}"
          echo "Version code: ${{ steps.version.outputs.version_code }}"

      - name: List AppImage tasks
        run: |
          ./gradlew :composeApp:tasks --all | grep -i appimage || echo "No AppImage tasks found"

      - name: Build Linux DEB + AppImage
        run: |
          ./gradlew :composeApp:packageReleaseDeb :composeApp:packageReleaseAppImage \
            --no-daemon \
            --no-configuration-cache \
            --info \
            --stacktrace \
            -Pnuvio.desktop.versionName=${{ steps.version.outputs.version }} \
            -Pnuvio.desktop.versionCode=${{ steps.version.outputs.version_code }} \
            -PlinuxAppRelease=1 2>&1 | tee gradle-build.log
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.native.enableKlibsCrossCompilation=false"
          APPIMAGETOOL: /usr/local/bin/appimagetool

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 30

      - name: Find artifacts
        id: artifacts
        run: |
          echo "=== Searching in composeApp/build ==="
          echo "deb=$(find composeApp/build -name '*.deb' -type f | head -1)" >> $GITHUB_OUTPUT
          echo "appimage=$(find composeApp/build -name '*.AppImage' -type f | head -1)" >> $GITHUB_OUTPUT
          echo "tar=$(find composeApp/build -name '*.tar.gz' -type f | head -1)" >> $GITHUB_OUTPUT
          find composeApp/build -name '*.deb' -type f
          find composeApp/build -name '*.AppImage' -type f
          find composeApp/build -name '*.tar.gz' -type f
          echo "=== Searching in composeApp/build/compose ==="
          find composeApp/build/compose -name '*.AppImage' -type f 2>/dev/null || echo "No AppImages in composeApp/build/compose"
          find composeApp/build/compose -name '*.deb' -type f 2>/dev/null || echo "No DEBs in composeApp/build/compose"
          find composeApp/build/compose -name '*.tar.gz' -type f 2>/dev/null || echo "No tarballs in composeApp/build/compose"
          echo "=== Searching in root build ==="
          find build -name '*.AppImage' -type f 2>/dev/null || echo "No AppImages in root build"
          find build -name '*.deb' -type f 2>/dev/null || echo "No DEBs in root build"
          find build -name '*.tar.gz' -type f 2>/dev/null || echo "No tarballs in root build"

      - name: Upload DEB artifact
        if: ${{ steps.artifacts.outputs.deb != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-deb
          path: ${{ steps.artifacts.outputs.deb }}
          retention-days: 30

      - name: Upload AppImage artifact
        if: ${{ steps.artifacts.outputs.appimage != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-appimage
          path: ${{ steps.artifacts.outputs.appimage }}
          retention-days: 30

      - name: Upload Tarball artifact
        if: ${{ steps.artifacts.outputs.tar != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-tarball
          path: ${{ steps.artifacts.outputs.tar }}
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.deb }}
            ${{ steps.artifacts.outputs.appimage }}
            ${{ steps.artifacts.outputs.tar }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}